<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DIGIPASS</title>
    <meta name="description" content="Create your DIGIPASS account and take control of your digital legacy today.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102c26'/%3E%3Cpath d='M20 18h16c9 0 16 6 16 14s-7 14-16 14h-6v10H20V18zm10 20h6c4 0 7-3 7-6s-3-6-7-6h-6v12z' fill='%23f7e7ce'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/shared.css">
</head>
<body>
    <nav class="page-nav">
        <a href="index.html" class="nav-logo">
            <svg width="28" height="28" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="10" fill="#1b3a2d"/>
                <rect x="11" y="13" width="22" height="17" rx="4" fill="none" stroke="#fdf6ec" stroke-width="2"/>
                <path d="M11 21 L33 21" stroke="#fdf6ec" stroke-width="1.5" fill="none"/>
                <rect x="14" y="25" width="6" height="4" rx="1" fill="#8cbf9c"/>
                <rect x="22" y="25" width="6" height="4" rx="1" fill="#8cbf9c" opacity=".45"/>
                <path d="M31 9 L31 14" stroke="#fdf6ec" stroke-width="2" stroke-linecap="round"/>
                <circle cx="31" cy="8" r="3.5" fill="#fdf6ec"/>
            </svg>
            <span class="nav-logo-text">Digipass</span>
        </a>
        <div class="nav-actions">
            <a href="login.html" class="nav-link">Sign In</a>
            <a href="index.html" class="nav-button">Home</a>
        </div>
    </nav>

    <div class="page-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page-content">
        <div class="auth-card">
            <div class="card-logo">
                <svg width="28" height="28" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="10" fill="#1b3a2d"/>
                    <rect x="11" y="13" width="22" height="17" rx="4" fill="none" stroke="#fdf6ec" stroke-width="2"/>
                    <path d="M11 21 L33 21" stroke="#fdf6ec" stroke-width="1.5" fill="none"/>
                    <rect x="14" y="25" width="6" height="4" rx="1" fill="#8cbf9c"/>
                    <rect x="22" y="25" width="6" height="4" rx="1" fill="#8cbf9c" opacity=".45"/>
                    <path d="M31 9 L31 14" stroke="#fdf6ec" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="31" cy="8" r="3.5" fill="#fdf6ec"/>
                </svg>
                <span class="card-logo-text">Digipass</span>
            </div>

            <h1 class="card-title">Create Account</h1>
            <p class="card-subtitle">Get started with DIGIPASS and take control of your digital legacy</p>

            <div id="errorMsg" class="d-none"></div>

            <form id="registerForm">
                <div class="form-field">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-field">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-field">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
                    </div>
                    <input type="password" class="form-control" id="password" name="password" placeholder="At least 8 characters" required>
                    <div class="strength-meter" id="strengthMeter">
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                    </div>
                    <div class="strength-label" id="strengthLabel">Weak</div>
                </div>

                <div class="form-field">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" class="checkbox-input" id="agree" name="agree" required>
                    <label for="agree" class="checkbox-label">
                        I agree to the <a href="#" target="_blank">Terms of Service</a> and <a href="#" target="_blank">Privacy Policy</a>
                    </label>
                </div>

                <button type="submit" class="submit-button">
                    <svg class="button-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M8 12h8M12 8v8"/>
                    </svg>
                    Create Account
                </button>
            </form>

            <div class="card-footer">
                <div class="footer-link">
                    Already have an account? <a href="login.html">Sign in</a>
                </div>
                <a href="index.html" class="back-link">
                    <svg class="back-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to home
                </a>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <div class="footer-item">© 2026 DIGIPASS</div>
        <div class="footer-item">
            <a href="#" class="footer-link-text">Privacy Policy</a>
        </div>
        <div class="footer-item">
            <a href="#" class="footer-link-text">Terms</a>
        </div>
    </footer>

    <script>
        const API_URL = 'https://digipass-3l63.onrender.com';

        // Password strength meter
        const passwordInput = document.getElementById('password');
        const strengthMeter = document.getElementById('strengthMeter');
        const strengthLabel = document.getElementById('strengthLabel');

        passwordInput.addEventListener('input', function() {
            let strength = 0;
            const value = this.value;

            if (value.length >= 8) strength++;
            if (/[A-Z]/.test(value)) strength++;
            if (/[0-9]/.test(value)) strength++;
            if (/[^A-Za-z0-9]/.test(value)) strength++;

            strengthMeter.classList.remove('weak', 'med', 'good');
            
            if (strength <= 1) {
                strengthMeter.classList.add('weak');
                strengthLabel.textContent = 'Weak';
            } else if (strength === 2) {
                strengthMeter.classList.add('med');
                strengthLabel.textContent = 'Medium';
            } else {
                strengthMeter.classList.add('good');
                strengthLabel.textContent = 'Strong';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showError('Passwords do not match.');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify({
                        id: data.data.userId,
                        fullName: data.data.fullName,
                        email: data.data.email
                    }));
                    location.href = 'dashboard.html';
                } else {
                    showError(data.message || 'Registration failed. Please try again.');
                }
            } catch (error) {
                console.error(error);
                showError('Unable to connect. Please try again later.');
            }
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.remove('d-none');
        }
    </script>
</body>
</html>
