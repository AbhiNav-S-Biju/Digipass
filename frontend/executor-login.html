<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executor Sign In - DIGIPASS</title>
    <meta name="description" content="Sign in to the Digipass Executor Portal to access and manage your assigned digital assets securely.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102c26'/%3E%3Cpath d='M20 18h16c9 0 16 6 16 14s-7 14-16 14h-6v10H20V18zm10 20h6c4 0 7-3 7-6s-3-6-7-6h-6v12z' fill='%23f7e7ce'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/shared.css">
</head>
<body>

    <!-- Animated orb background -->
    <div class="page-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Navbar -->
    <nav class="page-nav">
        <a href="index.html" class="nav-logo">
            <svg width="28" height="28" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <rect width="48" height="48" rx="10" fill="#1b3a2d"/>
                <rect x="11" y="13" width="22" height="17" rx="4" fill="none" stroke="#fdf6ec" stroke-width="2"/>
                <path d="M11 21 L33 21" stroke="#fdf6ec" stroke-width="1.5" fill="none"/>
                <rect x="14" y="25" width="6" height="4" rx="1" fill="#8cbf9c"/>
                <rect x="22" y="25" width="6" height="4" rx="1" fill="#8cbf9c" opacity=".45"/>
                <path d="M31 9 L31 14" stroke="#fdf6ec" stroke-width="2" stroke-linecap="round"/>
                <circle cx="31" cy="8" r="3.5" fill="#fdf6ec"/>
            </svg>
            <span class="nav-logo-text">Digipass</span>
        </a>
        <div class="nav-actions">
            <a href="index.html" class="nav-button">Home</a>
        </div>
    </nav>

    <!-- Main content -->
    <div class="page-content">
        <div class="auth-card">

            <!-- Badge -->
            <div class="card-badge-row">
                <div class="executor-badge-pill">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg>
                    Executor Portal
                </div>
            </div>

            <h1 class="card-title">Welcome, Executor</h1>
            <p class="card-subtitle">Sign in to access your assigned digital assets</p>

            <!-- Security note -->
            <div class="security-note">
                <svg class="security-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                <div class="security-text">
                    This portal is for <strong>designated executors only</strong>. All access is logged and monitored for security purposes.
                </div>
            </div>

            <!-- Error message -->
            <div id="errorMsg" class="d-none"></div>

            <!-- Login form -->
            <form id="executorLoginForm">
                <div class="form-field">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-field">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="submit-button">
                    <svg class="button-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                    Sign In
                </button>
            </form>

            <!-- Card footer -->
            <div class="card-footer">
                <div class="footer-link">
                    Don't have an account? <a href="executor-register.html">Verify here</a>
                </div>
                <a href="index.html" class="back-link">
                    <svg class="back-arrow" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to home
                </a>
            </div>

        </div>
    </div>

    <!-- Page footer -->
    <footer class="page-footer">
        <div class="footer-item">© 2026 DIGIPASS</div>
        <div class="footer-item">
            <a href="#" class="footer-link-text">Privacy Policy</a>
        </div>
        <div class="footer-item">
            <a href="#" class="footer-link-text">Terms</a>
        </div>
    </footer>

    <script>
        const API_URL = 'https://digipass-3l63.onrender.com';

        document.getElementById('executorLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const executorEmail = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/executor/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ executor_email: executorEmail, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('executorToken', data.data.token);
                    localStorage.setItem('executor', JSON.stringify(data.data.executor));
                    location.href = 'executor-dashboard.html';
                } else {
                    showError(data.message || 'Login failed. Please try again.');
                }
            } catch (error) {
                console.error(error);
                showError('Unable to connect. Please try again later.');
            }
        });

        function showError(message) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.classList.remove('d-none');
        }
    </script>
</body>
</html>
