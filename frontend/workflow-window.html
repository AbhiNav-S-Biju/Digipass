<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Step-by-step guide - DIGIPASS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b3a2d'/%3E%3Cpath d='M20 18h16c9 0 16 6 16 14s-7 14-16 14h-6v10H20V18zm10 20h6c4 0 7-3 7-6s-3-6-7-6h-6v12z' fill='%23fdf6ec'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/board.css?v=5">
    <style>
        /* ---------- Workflow guide (uses board.css tokens) ---------- */
        body.wf { overflow: hidden; }
        .wf-app {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 16px;
            height: 100vh; height: 100dvh;
            padding: 12px;
        }

        /* Steps rail: same deep-forest glass as the dashboards */
        .wf-rail { border-radius: var(--r-xl); padding: 16px 12px; display: flex; flex-direction: column; min-height: 0; }
        .wf-brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 14px; }
        .wf-plat {
            width: 44px; height: 44px; flex: none; border-radius: 14px;
            display: grid; place-items: center; font-size: 20px;
            background: rgba(253, 246, 236, 0.10); border: 1px solid rgba(253, 246, 236, 0.16);
        }
        .wf-brand h1 { font-size: 18px; font-weight: 700; color: var(--cream-light); letter-spacing: -0.01em; }
        .wf-brand .wf-action { font-size: 12.5px; color: rgba(253, 246, 236, 0.72); display: flex; align-items: center; gap: 6px; }
        .wf-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; flex: 1; scrollbar-width: none; }
        .wf-steps::-webkit-scrollbar { display: none; }
        .wf-step {
            width: 100%; display: flex; gap: 12px; align-items: flex-start; text-align: left;
            padding: 10px; border-radius: 14px; border: 1px solid transparent; background: transparent;
            color: rgba(253, 246, 236, 0.78); cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        @media (hover: hover) { .wf-step:hover { background: rgba(253, 246, 236, 0.06); } }
        .wf-num {
            flex: none; width: 30px; height: 30px; aspect-ratio: 1; border-radius: 50%;
            display: grid; place-items: center; font-size: 12.5px; font-weight: 700;
            border: 1px solid rgba(253, 246, 236, 0.25); color: rgba(253, 246, 236, 0.85);
        }
        .wf-step-title { font-size: 13.5px; font-weight: 600; line-height: 1.3; color: var(--cream-light); }
        .wf-step-sub { font-size: 12px; color: rgba(253, 246, 236, 0.62); line-height: 1.35; margin-top: 2px; }
        .wf-step.done .wf-num { background: rgba(140, 191, 156, 0.25); border-color: transparent; color: var(--sage); }
        .wf-step.active {
            background: linear-gradient(135deg, rgba(212, 234, 216, 0.22), rgba(212, 234, 216, 0.08));
            border-color: rgba(212, 234, 216, 0.30);
            box-shadow: 0 1px 0 rgba(253, 246, 236, 0.18) inset, 0 10px 24px -12px rgba(140, 191, 156, 0.75);
        }
        .wf-step.active .wf-num {
            border-color: rgba(253, 246, 236, 0.35); color: var(--cream-light);
            background: radial-gradient(circle at 35% 30%, #8cbf9c 0%, var(--forest-light) 55%, var(--forest-mid) 100%);
            box-shadow: 0 0 0 4px rgba(140, 191, 156, 0.16), 0 8px 18px -6px rgba(61, 122, 90, 0.9);
            animation: sbPop 0.55s var(--spring);
        }
        .wf-rail-foot { padding: 12px 6px 2px; border-top: 1px solid rgba(253, 246, 236, 0.10); margin-top: 10px; }
        .wf-rail-foot .meter-row { color: rgba(253, 246, 236, 0.8); }
        .wf-rail-foot .meter-row span:last-child { color: rgba(253, 246, 236, 0.7); }
        .wf-rail-foot .meter { background: rgba(253, 246, 236, 0.15); }
        .wf-rail-foot .meter > span { background: var(--sage); }

        /* Main column */
        .wf-main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
        .wf-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 2px 14px; }
        .wf-top .wf-crumb { font-size: 13px; color: var(--ink-muted); }
        .wf-top-end { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
        .wf-icon-btn { width: 40px; height: 40px; padding: 0; justify-content: center; }

        /* Guide card: the part that also floats in Picture-in-Picture */
        .wf-card {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            background: var(--card); border-radius: var(--r-xl); box-shadow: var(--shadow-card);
            overflow: hidden;
        }
        .wf-card-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 26px; }
        .wf-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
        .wf-title { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 4px 0 6px; color: var(--ink); }
        .wf-desc { font-size: 14px; color: var(--ink-muted); margin: 0 0 18px; max-width: 70ch; }

        .wf-section { margin-top: 16px; }
        .wf-section-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
        .wf-do { list-style: none; margin: 0; padding: 0; counter-reset: d; display: flex; flex-direction: column; gap: 8px; }
        .wf-do li { display: flex; gap: 12px; align-items: flex-start; background: var(--cream-light); border-radius: var(--r-md); padding: 12px 14px; font-size: 14.5px; line-height: 1.45; }
        .wf-do .do-ico { flex: none; width: 32px; height: 32px; aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; background: #fff; color: var(--forest-deep); box-shadow: var(--shadow-card); font-size: 13px; }
        .wf-do .do-kind { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }

        .wf-tips { list-style: none; margin: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--warn-soft); border-radius: var(--r-md); font-size: 13.5px; }
        .wf-tips li { display: flex; gap: 8px; }
        .wf-tips li::before { content: ''; flex: none; width: 6px; height: 6px; border-radius: 50%; margin-top: 8px; background: var(--warn); }

        .wf-msg { background: var(--sage); border-radius: var(--r-md); padding: 14px; }
        .wf-msg p { margin: 0 0 10px; font-size: 14.5px; white-space: pre-wrap; color: var(--forest-deep); }

        /* Sign-in details (collapsible on every step) */
        .wf-creds { border: 1px solid var(--line-strong); border-radius: var(--r-md); margin-bottom: 16px; background: #fff; }
        .wf-creds summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 14px; font-size: 13.5px; font-weight: 600; }
        .wf-creds summary::-webkit-details-marker { display: none; }
        .wf-creds summary .chev { margin-left: auto; color: var(--ink-muted); transition: transform 0.2s; }
        .wf-creds[open] summary .chev { transform: rotate(180deg); }
        .wf-creds-body { padding: 0 14px 14px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
        .wf-field label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-muted); margin-bottom: 4px; }
        .wf-field .row { display: flex; gap: 6px; }
        .wf-field .val { flex: 1; min-width: 0; background: var(--cream-light); border-radius: 10px; padding: 9px 12px; font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 13.5px; overflow-wrap: anywhere; }
        .wf-field .btn-ghost { padding: 8px 11px; }

        /* Card footer: navigation (works inside the floating window too) */
        .wf-nav { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--card); }
        .wf-nav .wf-prog { flex: 1; min-width: 0; }
        .wf-nav .wf-prog .meter-row { font-size: 12.5px; margin-bottom: 4px; }

        /* "Back from the app?" prompt (phones) */
        .wf-return {
            position: fixed; left: 12px; right: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 50;
            border-radius: var(--r-lg); padding: 14px; display: none;
            animation: toastIn 0.3s var(--ease-out);
        }
        .wf-return.show { display: block; }
        .wf-return p { margin: 0 0 10px; font-size: 14px; color: var(--cream-light); }
        .wf-return .row { display: flex; gap: 8px; }
        .wf-return .btn-ghost { color: var(--cream-light); border-color: rgba(253, 246, 236, 0.35); }

        .wf-state { margin: auto; text-align: center; color: var(--ink-muted); padding: 40px 20px; }

        /* Narrow screens: phones, and the guide when tiled beside the site */
        .wf-mini, .wf-dots { display: none; }
        .wf-action { display: flex; align-items: center; gap: 6px; }
        @media (max-width: 900px) {
            body.wf { overflow: auto; }
            .wf-app { display: block; height: auto; min-height: 100dvh; padding: 0 0 calc(84px + env(safe-area-inset-bottom)); }
            .wf-rail { display: none; }
            .wf-mini {
                display: flex; align-items: center; gap: 10px;
                position: sticky; top: 0; z-index: 20;
                padding: 12px 14px; color: var(--cream-light);
                border-radius: 0 0 var(--r-lg) var(--r-lg);
            }
            .wf-mini .wf-plat { width: 38px; height: 38px; font-size: 17px; border-radius: 12px; }
            .wf-mini .wf-mini-name { font-size: 15.5px; font-weight: 700; line-height: 1.2; }
            .wf-mini .wf-action { font-size: 12px; color: rgba(253, 246, 236, 0.72); }
            .wf-mini .wf-mini-end { margin-left: auto; display: flex; gap: 6px; }
            .wf-mini .wf-icon-btn { width: 36px; height: 36px; background: rgba(253, 246, 236, 0.10); color: var(--cream-light); border: 1px solid rgba(253, 246, 236, 0.18); }
            .wf-dots { display: flex; gap: 6px; padding: 12px 16px 4px; }
            .wf-dots span { flex: 1; height: 5px; border-radius: 4px; background: rgba(27, 58, 45, 0.12); transition: background 0.3s; }
            .wf-dots span.done { background: var(--forest-light); }
            .wf-dots span.active { background: var(--forest-deep); }
            .wf-main { padding: 0 12px; }
            .wf-top { padding: 10px 2px 10px; }
            .wf-top .wf-crumb { display: none; }
            .wf-top-end { margin-left: 0; width: 100%; }
            .wf-top-end .pill { flex: 1; justify-content: center; }
            .wf-top-end .wf-close { display: none; }
            .wf-card { overflow: visible; }
            .wf-card-scroll { padding: 18px 16px; overflow: visible; }
            .wf-title { font-size: 22px; }
            .wf-nav { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40; border-radius: var(--r-lg); box-shadow: var(--shadow-pop); border-top: 0; padding: 10px 12px; }
        }

        /* Inside the floating Picture-in-Picture window */
        /* The floating window is narrow, so the phone rules above also match inside it;
           these override them so the card scrolls and the step bar stays docked. */
        body.wf-pip { margin: 0; background: var(--card); overflow: hidden; height: 100vh; }
        body.wf-pip .wf-card { height: 100vh; display: flex; flex-direction: column; overflow: hidden; border-radius: 0; box-shadow: none; }
        body.wf-pip .wf-card-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px; }
        body.wf-pip .wf-nav { position: static; flex: none; border-radius: 0; box-shadow: none; border-top: 1px solid var(--line); }
        body.wf-pip .wf-title { font-size: 19px; }
        body.wf-pip .wf-creds-body { grid-template-columns: 1fr; }
        body.wf-pip .wf-nav { padding: 10px 12px; }
    </style>
    <script src="js/config.js?v=2"></script>
</head>
<body class="board-body wf">
    <div class="wf-app">
        <aside class="wf-rail glass" aria-label="Steps">
            <div class="wf-brand">
                <span class="wf-plat js-plat-icon"><i class="fas fa-globe"></i></span>
                <div style="min-width:0">
                    <h1 class="js-plat-name">Account</h1>
                    <div class="wf-action js-action"><i class="fas fa-list"></i>Steps</div>
                </div>
            </div>
            <ol class="wf-steps" id="wfSteps"></ol>
            <div class="wf-rail-foot">
                <div class="meter-row"><span>Progress</span><span class="js-progress-text">–</span></div>
                <div class="meter"><span class="js-progress-bar"></span></div>
            </div>
        </aside>

        <!-- Narrow header (phones and the tiled guide) -->
        <header class="wf-mini glass">
            <span class="wf-plat js-plat-icon"><i class="fas fa-globe"></i></span>
            <div style="min-width:0">
                <div class="wf-mini-name js-plat-name">Account</div>
                <div class="wf-action js-action">Steps</div>
            </div>
            <div class="wf-mini-end">
                <button type="button" class="pill wf-icon-btn" id="closeBtnMini" aria-label="Close guide"><i class="fas fa-xmark"></i></button>
            </div>
        </header>
        <div class="wf-dots wf-mini-dots" id="wfDots" aria-hidden="true"></div>

        <main class="wf-main">
            <div class="wf-top">
                <span class="wf-crumb">Follow each step, then come back here for the next one.</span>
                <div class="wf-top-end">
                    <button type="button" class="pill pill-primary" id="openSiteBtn" hidden><i class="fas fa-arrow-up-right-from-square"></i><span id="openSiteLabel">Open site</span></button>
                    <button type="button" class="pill pill-outline" id="floatBtn" hidden><i class="fas fa-clone"></i>Float guide</button>
                    <button type="button" class="pill wf-icon-btn wf-close" id="closeBtn" aria-label="Close guide"><i class="fas fa-xmark"></i></button>
                </div>
            </div>

            <!-- Everything inside #guideCard also works when moved into the floating window -->
            <section class="wf-card" id="guideCard" aria-live="polite">
                <div class="wf-card-scroll" data-role="scroll">
                    <div class="wf-state"><div class="skeleton" style="height:220px"></div></div>
                </div>
                <nav class="wf-nav" aria-label="Step navigation">
                    <button type="button" class="btn-ghost" data-act="prev"><i class="fas fa-chevron-left"></i>Back</button>
                    <div class="wf-prog">
                        <div class="meter-row"><span data-role="step-label">Step –</span><span data-role="step-pct"></span></div>
                        <div class="meter"><span data-role="step-bar"></span></div>
                    </div>
                    <button type="button" class="btn-forest" data-act="next">Next<i class="fas fa-chevron-right"></i></button>
                </nav>
            </section>
        </main>
    </div>

    <div class="wf-return glass" id="returnPrompt" role="dialog" aria-live="polite">
        <p id="returnText">Back from the app? Did that step work?</p>
        <div class="row">
            <button type="button" class="btn-ghost" id="returnNo">Not yet</button>
            <button type="button" class="promo-btn" id="returnYes" style="width:auto;flex:1"><span>Yes, next step</span><span class="chev"><i class="fas fa-chevron-right"></i></span></button>
        </div>
    </div>

    <script src="js/workflow-steps-detailed.js"></script>
    <script>
        // ---------------- Data ----------------
        let allSteps = [];
        let current = 0;
        let platformName = 'Platform';
        let actionType = 'pass';
        let assetInfo = null;
        let progressAssetId = null;
        let pipWindow = null;
        let handedOffAt = 0;   // when we last sent the user out to the site/app

        const IS_NARROW = () => window.matchMedia('(max-width: 900px)').matches;
        const IS_TOUCH = () => window.matchMedia('(pointer: coarse)').matches;

        // Where each platform lives. On phones these https links open the installed app.
        const PLATFORM_URLS = {
            'Instagram': 'https://www.instagram.com/',
            'Facebook': 'https://www.facebook.com/',
            'Twitter': 'https://x.com/',
            'LinkedIn': 'https://www.linkedin.com/',
            'TikTok': 'https://www.tiktok.com/',
            'Snapchat': 'https://accounts.snapchat.com/',
            'Discord': 'https://discord.com/app',
            'Gmail': 'https://mail.google.com/',
            'Outlook': 'https://outlook.live.com/',
            'Yahoo Mail': 'https://mail.yahoo.com/',
            'ProtonMail': 'https://mail.proton.me/',
            'PayPal': 'https://www.paypal.com/',
            'Google Pay': 'https://pay.google.com/',
            'Amazon': 'https://www.amazon.com/',
            'Google Drive': 'https://drive.google.com/',
            'Dropbox': 'https://www.dropbox.com/',
            'OneDrive': 'https://onedrive.live.com/',
            'iCloud': 'https://www.icloud.com/',
            'Netflix': 'https://www.netflix.com/',
            'Spotify': 'https://www.spotify.com/account/',
            'Disney+': 'https://www.disneyplus.com/',
            'Hulu': 'https://www.hulu.com/'
        };

        const PLATFORM_ICONS = {
            instagram: 'fab fa-instagram', facebook: 'fab fa-facebook-f', twitter: 'fab fa-x-twitter', linkedin: 'fab fa-linkedin-in',
            gmail: 'fas fa-envelope', outlook: 'fas fa-envelope', yahoo: 'fab fa-yahoo', proton: 'fas fa-envelope',
            'google pay': 'fab fa-google-pay', 'google drive': 'fab fa-google-drive', google: 'fab fa-google',
            paypal: 'fab fa-paypal', netflix: 'fas fa-film', spotify: 'fab fa-spotify', amazon: 'fab fa-amazon',
            dropbox: 'fab fa-dropbox', icloud: 'fab fa-apple', disney: 'fas fa-wand-magic-sparkles', tiktok: 'fab fa-tiktok',
            snapchat: 'fab fa-snapchat', discord: 'fab fa-discord', hulu: 'fas fa-tv'
        };

        const ACTION_META = {
            delete: { icon: 'fa-trash-can', label: 'Delete account' },
            pass: { icon: 'fa-hand-holding-heart', label: 'Pass on' },
            pass_executor: { icon: 'fa-hand-holding-heart', label: 'Pass on' },
            last_message: { icon: 'fa-feather', label: 'Last message' }
        };

        const ICON_RULES = [
            { keys: ['open web browser', 'web browser', 'open browser', 'address bar'], icon: 'fa-globe', label: 'Open browser' },
            { keys: ['.com'], icon: 'fa-arrow-up-right-from-square', label: 'Go to site' },
            { keys: ['log in', 'login', 'sign in', 'enter username', 'enter email', 'enter password'], icon: 'fa-right-to-bracket', label: 'Sign in' },
            { keys: ['two-factor', '2fa', 'authenticat', 'verification code'], icon: 'fa-shield-halved', label: 'Verification' },
            { keys: ['profile picture', 'profile icon', 'your profile', 'top right', 'profile photo'], icon: 'fa-circle-user', label: 'Profile' },
            { keys: ['accounts center', 'personal details', 'account ownership', 'deactivation or deletion'], icon: 'fa-sliders', label: 'Accounts Center' },
            { keys: ['settings'], icon: 'fa-gear', label: 'Settings' },
            { keys: ['security'], icon: 'fa-lock', label: 'Security' },
            { keys: ['change password', 'new password'], icon: 'fa-key', label: 'Password' },
            { keys: ['delete account', 'permanently delet'], icon: 'fa-trash-can', label: 'Delete' },
            { keys: ['deactivate'], icon: 'fa-circle-pause', label: 'Deactivate' },
            { keys: ['reason'], icon: 'fa-list-check', label: 'Choose a reason' },
            { keys: ['download your data', 'export', 'download a copy'], icon: 'fa-download', label: 'Download data' },
            { keys: ['message', 'compose', 'post'], icon: 'fa-pen-to-square', label: 'Write' },
            { keys: ['send'], icon: 'fa-paper-plane', label: 'Send' },
            { keys: ['subscription', 'billing', 'payment'], icon: 'fa-credit-card', label: 'Billing' },
            { keys: ['confirm'], icon: 'fa-circle-check', label: 'Confirm' },
            { keys: ['continue', 'next'], icon: 'fa-arrow-right', label: 'Continue' },
            { keys: ['scroll'], icon: 'fa-arrows-up-down', label: 'Scroll' },
            { keys: ['press enter', 'press tab'], icon: 'fa-keyboard', label: 'Keyboard' },
            { keys: ['save'], icon: 'fa-floppy-disk', label: 'Save' },
            { keys: ['wait', 'load'], icon: 'fa-hourglass-half', label: 'Wait' }
        ];

        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
        }

        function iconFor(text) {
            const low = String(text || '').toLowerCase();
            const rule = ICON_RULES.find(r => r.keys.some(k => low.includes(k)));
            return rule ? { icon: rule.icon, label: rule.label } : { icon: 'fa-hand-pointer', label: 'Do this' };
        }

        function parseAction(raw) {
            if (!raw) return [];
            return String(raw)
                .split(/\s*(?:->|→)\s*|\n+|\d+\)\s+|\d+\.\s+/)
                .map(s => s.trim())
                .filter(s => s.length > 3)
                .map(text => ({ text, ...iconFor(text) }));
        }

        function platformIcon() {
            const low = platformName.toLowerCase();
            const key = Object.keys(PLATFORM_ICONS).sort((a, b) => b.length - a.length).find(k => low.includes(k));
            return key ? PLATFORM_ICONS[key] : 'fas fa-globe';
        }

        // ---------------- Progress (shared with the executor board) ----------------
        function readSavedProgress() {
            if (!progressAssetId) return null;
            try { return JSON.parse(localStorage.getItem(`digipass-progress-${progressAssetId}`) || 'null'); }
            catch (e) { return null; }
        }
        function saveProgress(step, total, done) {
            if (!progressAssetId) return;
            try {
                localStorage.setItem(`digipass-progress-${progressAssetId}`, JSON.stringify({ step, total, done, updatedAt: Date.now() }));
            } catch (e) { /* storage unavailable: the board just won't update */ }
        }

        // ---------------- Rendering ----------------
        // The card may live in this window or in the floating window, so always
        // look things up through the card, never through `document`.
        const card = () => document.getElementById('guideCard') || (pipWindow && pipWindow.document.getElementById('guideCard'));

        function renderCredentials() {
            if (!assetInfo || (!assetInfo.account_identifier && !assetInfo.account_password)) return '';
            const openFirst = current <= 1 ? ' open' : '';
            return `
                <details class="wf-creds"${openFirst}>
                    <summary><i class="fas fa-key"></i>Sign-in details for this account<i class="fas fa-chevron-down chev"></i></summary>
                    <div class="wf-creds-body">
                        ${assetInfo.account_identifier ? `
                        <div class="wf-field">
                            <label>Email or username</label>
                            <div class="row"><span class="val">${esc(assetInfo.account_identifier)}</span>
                                <button type="button" class="btn-ghost" data-act="copy" data-copy="user" aria-label="Copy username"><i class="fas fa-copy"></i></button></div>
                        </div>` : ''}
                        ${assetInfo.account_password ? `
                        <div class="wf-field">
                            <label>Password</label>
                            <div class="row"><span class="val" data-role="pwd">${'•'.repeat(Math.min(assetInfo.account_password.length, 12) || 8)}</span>
                                <button type="button" class="btn-ghost" data-act="reveal" aria-label="Show password"><i class="fas fa-eye"></i></button>
                                <button type="button" class="btn-ghost" data-act="copy" data-copy="pass" aria-label="Copy password"><i class="fas fa-copy"></i></button></div>
                        </div>` : ''}
                    </div>
                </details>`;
        }

        function renderStep() {
            const root = card();
            const step = allSteps[current];
            if (!root || !step) return;
            const total = allSteps.length;
            const pct = Math.round(((current + 1) / total) * 100);
            const meta = ACTION_META[actionType] || { icon: 'fa-list', label: 'Steps' };
            const actions = parseAction(step.action);

            root.querySelector('[data-role="scroll"]').innerHTML = `
                ${renderCredentials()}
                <div class="wf-head">
                    <span class="tag tag-neutral">Step ${current + 1} of ${total}</span>
                    <span class="tag ${actionType === 'delete' ? 'tag-delete' : actionType === 'last_message' ? 'tag-message' : 'tag-pass'}"><i class="fas ${meta.icon}"></i>${esc(meta.label)}</span>
                </div>
                <h2 class="wf-title">${esc(step.title || `Step ${current + 1}`)}</h2>
                ${step.description ? `<p class="wf-desc">${esc(step.description)}</p>` : ''}
                ${actions.length ? `
                <div class="wf-section">
                    <div class="wf-section-head"><i class="fas fa-hand-pointer"></i>What to do</div>
                    <ol class="wf-do">
                        ${actions.map(a => `<li><span class="do-ico"><i class="fas ${a.icon}"></i></span><span><span class="do-kind">${esc(a.label)}</span>${esc(a.text)}</span></li>`).join('')}
                    </ol>
                </div>` : ''}
                ${step.message ? `
                <div class="wf-section">
                    <div class="wf-section-head"><i class="fas fa-feather"></i>Their message to post</div>
                    <div class="wf-msg"><p>${esc(step.message)}</p>
                        <button type="button" class="btn-forest" data-act="copy" data-copy="message"><i class="fas fa-copy"></i>Copy message</button></div>
                </div>` : ''}
                ${Array.isArray(step.tips) && step.tips.length ? `
                <div class="wf-section">
                    <div class="wf-section-head"><i class="fas fa-lightbulb"></i>Good to know</div>
                    <ul class="wf-tips">${step.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
                </div>` : ''}
            `;
            root.querySelector('[data-role="scroll"]').scrollTop = 0;

            root.querySelector('[data-role="step-label"]').textContent = `Step ${current + 1} of ${total}`;
            root.querySelector('[data-role="step-pct"]').textContent = `${pct}%`;
            root.querySelector('[data-role="step-bar"]').style.width = `${pct}%`;

            const prev = root.querySelector('[data-act="prev"]');
            const next = root.querySelector('[data-act="next"]');
            prev.disabled = current === 0;
            const last = current === total - 1;
            next.dataset.act = last ? 'done' : 'next';
            next.innerHTML = last ? '<i class="fas fa-check"></i>Taken care of' : 'Next<i class="fas fa-chevron-right"></i>';

            renderRail(pct);

            const saved = readSavedProgress();
            saveProgress(current + 1, total, Boolean(saved && saved.done));
        }

        function renderRail(pct) {
            document.getElementById('wfSteps').innerHTML = allSteps.map((s, i) => `
                <li><button type="button" class="wf-step${i === current ? ' active' : ''}${i < current ? ' done' : ''}" data-goto="${i}" ${i === current ? 'aria-current="step"' : ''}>
                    <span class="wf-num">${i < current ? '<i class="fas fa-check"></i>' : i + 1}</span>
                    <span><span class="wf-step-title">${esc(s.title || `Step ${i + 1}`)}</span>${s.description ? `<span class="wf-step-sub" style="display:block">${esc(s.description)}</span>` : ''}</span>
                </button></li>`).join('');
            document.querySelectorAll('.js-progress-text').forEach(el => { el.textContent = `${current + 1} of ${allSteps.length}`; });
            document.querySelectorAll('.js-progress-bar').forEach(el => { el.style.width = `${pct}%`; });
            document.getElementById('wfDots').innerHTML = allSteps.map((_, i) =>
                `<span class="${i < current ? 'done' : i === current ? 'active' : ''}"></span>`).join('');
        }

        function goTo(i) {
            if (i < 0 || i >= allSteps.length) return;
            current = i;
            renderStep();
            if (IS_NARROW() && !pipWindow) window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function finish() {
            saveProgress(allSteps.length, allSteps.length, true);
            const root = card();
            root.querySelector('[data-role="scroll"]').innerHTML = `
                <div class="state-panel" style="margin:20px auto">
                    <div class="state-icon"><i class="fas fa-circle-check"></i></div>
                    <h2>${esc(platformName)} is taken care of</h2>
                    <p>Thank you. This account now shows as done on your board. You can close this window.</p>
                </div>`;
            root.querySelector('[data-act="prev"]').disabled = false;
            const next = root.querySelector('[data-act="done"], [data-act="next"]');
            next.dataset.act = 'close';
            next.innerHTML = '<i class="fas fa-xmark"></i>Close';
        }

        // ---------------- Card interactions (delegated, so they work in the floating window) ----------------
        async function copyText(text, button) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = button.ownerDocument.createElement('textarea');
                ta.value = text; button.ownerDocument.body.appendChild(ta); ta.select();
                button.ownerDocument.execCommand('copy'); ta.remove();
            }
            const html = button.innerHTML;
            button.innerHTML = '<i class="fas fa-check"></i>' + (button.textContent.trim() ? 'Copied' : '');
            setTimeout(() => { button.innerHTML = html; }, 1600);
        }

        function onCardClick(e) {
            const btn = e.target.closest('[data-act]');
            if (!btn) return;
            const act = btn.dataset.act;
            if (act === 'prev') goTo(current - 1);
            else if (act === 'next') goTo(current + 1);
            else if (act === 'done') finish();
            else if (act === 'close') closeGuide();
            else if (act === 'copy') {
                const what = btn.dataset.copy;
                const text = what === 'user' ? assetInfo.account_identifier : what === 'pass' ? assetInfo.account_password : allSteps[current].message;
                copyText(text || '', btn);
            } else if (act === 'reveal') {
                const val = btn.closest('.row').querySelector('[data-role="pwd"]');
                const showing = btn.dataset.showing === '1';
                val.textContent = showing ? '•'.repeat(Math.min(assetInfo.account_password.length, 12) || 8) : assetInfo.account_password;
                btn.dataset.showing = showing ? '0' : '1';
                btn.innerHTML = showing ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
            }
        }

        // ---------------- Opening the real site ----------------
        function siteUrl() { return PLATFORM_URLS[platformName] || null; }

        // Laptop: put the site in a window filling the space to the right of this guide.
        // Phone: a normal link, which opens the installed app if there is one.
        function openSite() {
            const url = siteUrl();
            if (!url) return;
            handedOffAt = Date.now();

            if (IS_TOUCH() && IS_NARROW()) {
                window.open(url, '_blank', 'noopener');
                return;
            }

            const scr = window.screen;
            const left0 = scr.availLeft || 0;
            const top0 = scr.availTop || 0;
            // Narrow guide on the left, site on the rest of the screen
            const guideW = Math.min(480, Math.round(scr.availWidth * 0.34));
            try { window.moveTo(left0, top0); window.resizeTo(guideW, scr.availHeight); } catch (e) { /* only works for popup windows */ }
            const guideRight = Math.max(window.screenX + window.outerWidth, left0 + guideW);
            const siteW = Math.max(600, left0 + scr.availWidth - guideRight);
            const features = `popup=yes,left=${guideRight},top=${top0},width=${siteW},height=${scr.availHeight}`;
            const win = window.open(url, 'digipass-site', features);
            if (!win) window.open(url, '_blank', 'noopener'); // popup blocked: plain tab
        }

        // ---------------- Floating guide (Chrome/Edge desktop) ----------------
        async function floatGuide() {
            if (!('documentPictureInPicture' in window)) return;
            if (pipWindow) { pipWindow.close(); return; }

            const node = document.getElementById('guideCard');
            const placeholder = document.createElement('div');
            placeholder.className = 'wf-state';
            placeholder.id = 'guidePlaceholder';
            placeholder.innerHTML = '<p>The guide is floating in its own window. Close it to bring it back here.</p>';

            pipWindow = await documentPictureInPicture.requestWindow({ width: 400, height: 620 });
            // Copy the page's styles into the floating window
            [...document.styleSheets].forEach(sheet => {
                try {
                    const style = pipWindow.document.createElement('style');
                    style.textContent = [...sheet.cssRules].map(r => r.cssText).join('\n');
                    pipWindow.document.head.appendChild(style);
                } catch (e) {
                    if (sheet.href) {
                        const link = pipWindow.document.createElement('link');
                        link.rel = 'stylesheet'; link.href = sheet.href;
                        pipWindow.document.head.appendChild(link);
                    }
                }
            });
            pipWindow.document.title = `${platformName} guide`;
            pipWindow.document.body.className = 'board-body wf-pip';
            node.parentNode.insertBefore(placeholder, node);
            pipWindow.document.body.append(node);
            document.getElementById('floatBtn').innerHTML = '<i class="fas fa-clone"></i>Bring guide back';

            pipWindow.addEventListener('pagehide', () => {
                const ph = document.getElementById('guidePlaceholder');
                ph.replaceWith(node);
                pipWindow = null;
                document.getElementById('floatBtn').innerHTML = '<i class="fas fa-clone"></i>Float guide';
            });

            // Take them to the site in this tab's browser; the guide stays on top
            const url = siteUrl();
            if (url) { handedOffAt = Date.now(); window.open(url, '_blank', 'noopener'); }
        }

        // ---------------- Phone: "back from the app?" ----------------
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible' || !handedOffAt || pipWindow) return;
            if (!IS_NARROW()) return;
            if (Date.now() - handedOffAt < 4000) return; // came straight back; probably didn't do anything yet
            handedOffAt = 0;
            const last = current === allSteps.length - 1;
            document.getElementById('returnText').textContent = last
                ? `Back from ${platformName}? Did you finish the last step?`
                : `Back from ${platformName}? Did step ${current + 1} work?`;
            document.querySelector('#returnYes span').textContent = last ? 'Yes, all done' : 'Yes, next step';
            document.getElementById('returnPrompt').classList.add('show');
        });
        document.getElementById('returnYes').addEventListener('click', () => {
            document.getElementById('returnPrompt').classList.remove('show');
            if (current === allSteps.length - 1) finish(); else goTo(current + 1);
        });
        document.getElementById('returnNo').addEventListener('click', () => {
            document.getElementById('returnPrompt').classList.remove('show');
        });

        // ---------------- Wiring ----------------
        function closeGuide() {
            if (pipWindow) pipWindow.close();
            window.close();
        }

        document.getElementById('guideCard').addEventListener('click', onCardClick);
        document.getElementById('wfSteps').addEventListener('click', (e) => {
            const b = e.target.closest('[data-goto]');
            if (b) goTo(Number(b.dataset.goto));
        });
        document.getElementById('closeBtn').addEventListener('click', closeGuide);
        document.getElementById('closeBtnMini').addEventListener('click', closeGuide);
        document.getElementById('openSiteBtn').addEventListener('click', openSite);
        document.getElementById('floatBtn').addEventListener('click', floatGuide);
        document.addEventListener('keydown', (e) => {
            if (e.target.closest('input, textarea')) return;
            if (e.key === 'ArrowRight') goTo(current + 1);
            if (e.key === 'ArrowLeft') goTo(current - 1);
        });

        function showError(message) {
            card().querySelector('[data-role="scroll"]').innerHTML = `
                <div class="state-panel" style="margin:20px auto">
                    <div class="state-icon" style="background:var(--danger-soft);color:var(--danger)"><i class="fas fa-triangle-exclamation"></i></div>
                    <h2>This guide could not open</h2><p>${esc(message)}</p>
                </div>`;
            card().querySelector('.wf-nav').style.display = 'none';
        }

        function applyBranding() {
            const meta = ACTION_META[actionType] || { icon: 'fa-list', label: 'Steps' };
            document.querySelectorAll('.js-plat-name').forEach(el => { el.textContent = platformName; });
            document.querySelectorAll('.js-plat-icon').forEach(el => { el.innerHTML = `<i class="${platformIcon()}"></i>`; });
            document.querySelectorAll('.js-action').forEach(el => { el.innerHTML = `<i class="fas ${meta.icon}"></i>${esc(meta.label)}`; });
            document.title = `${platformName}: ${meta.label} - DIGIPASS`;

            if (siteUrl()) {
                const btn = document.getElementById('openSiteBtn');
                btn.hidden = false;
                document.getElementById('openSiteLabel').textContent = IS_TOUCH() && IS_NARROW()
                    ? `Open ${platformName}`
                    : `Open ${platformName} side by side`;
            }
            if ('documentPictureInPicture' in window && !IS_TOUCH()) {
                document.getElementById('floatBtn').hidden = false;
            }
        }

        function loadInstructions() {
            const assetId = sessionStorage.getItem('digipass_asset_id');
            actionType = sessionStorage.getItem('digipass_action') || 'pass';
            platformName = sessionStorage.getItem('digipass_platform_name') || 'Account';
            const accountIdentifier = sessionStorage.getItem('digipass_account') || '';
            const password = sessionStorage.getItem('digipass_password') || '';
            const message = sessionStorage.getItem('digipass_message') || '';

            applyBranding();

            if (!assetId) {
                showError('Open this guide from the executor portal by choosing an account.');
                return;
            }
            progressAssetId = assetId;

            let steps = [];
            const wf = typeof WORKFLOWS !== 'undefined' && WORKFLOWS[platformName] && WORKFLOWS[platformName].actions[actionType];
            if (wf) {
                steps = JSON.parse(JSON.stringify(wf.steps || []));
                if (message && steps.length) {
                    const i = steps.findIndex(s => s.showFarewellMessage);
                    if (i !== -1) steps[i].message = message;
                    else steps.push({ title: 'Post their message', description: 'Share the words they left', action: 'Post the message below on the account', message, tips: [] });
                }
            } else {
                steps = [
                    { title: `Sign in to ${platformName}`, description: 'Use the sign-in details above', action: `Open ${platformName} → Sign in with the email or username and password provided`, tips: ['If a verification code is sent to the owner\'s phone or email, you may need access to it.'] },
                    { title: actionType === 'delete' ? 'Find the delete option' : actionType === 'last_message' ? 'Post their message' : 'Take over the account', description: 'Look in the account settings', action: 'Open Settings → Look for Account, Privacy or Security', message: message || undefined, tips: ['Most services keep account closure under Settings → Account.'] }
                ];
            }

            allSteps = steps;
            assetInfo = { account_identifier: accountIdentifier, account_password: password, last_message: message };

            const saved = readSavedProgress();
            current = saved && !saved.done && saved.step >= 1 && saved.step <= steps.length ? saved.step - 1 : 0;
            renderStep();
        }

        loadInstructions();
    </script>
</body>
</html>
