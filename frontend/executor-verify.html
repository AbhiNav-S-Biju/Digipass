<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executor Verification - DIGIPASS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23102c26'/%3E%3Cpath d='M20 18h16c9 0 16 6 16 14s-7 14-16 14h-6v10H20V18zm10 20h6c4 0 7-3 7-6s-3-6-7-6h-6v12z' fill='%23f7e7ce'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/shared.css">
</head>
<body>

    <nav class="page-nav">
        <a href="index.html" class="nav-logo">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <rect width="64" height="64" rx="14" fill="#102c26"/>
                <path d="M20 18h16c9 0 16 6 16 14s-7 14-16 14h-6v10H20V18zm10 20h6c4 0 7-3 7-6s-3-6-7-6h-6v12z" fill="#f7e7ce"/>
            </svg>
            DIGIPASS
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-button">Home</a>
        </div>
    </nav>

    <div class="page-bg">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <main class="page-content">
        <div class="auth-card" style="max-width: 500px;">

            <div class="verify-icon" style="font-size: 3rem; text-align: center; margin-bottom: 1rem;">✓</div>

            <h1 class="card-title">You're Invited!</h1>

            <div class="info-box">
                <strong>🔐 Executor Verification</strong><br>
                You've been invited to be an executor for a digital estate. Complete your setup to access the assets assigned to you.
            </div>

            <div class="qr-display" id="qrCodeDisplay">
                <p>Loading QR code...</p>
                <img id="qrImage" style="display: none;" alt="Verification QR Code">
            </div>
            <p class="qr-text">Scan this code with your phone camera to verify</p>

            <div class="divider-or"><span>or</span></div>

            <div class="link-section">
                <h3>Direct Link</h3>
                <div id="verificationLink" class="link-display">Loading link...</div>
                <div class="button-group">
                    <button onclick="copyLink()" class="btn-secondary-outline">Copy Link</button>
                    <button onclick="openLink()" class="btn-secondary-outline">Open Link</button>
                </div>
            </div>

            <div class="button-group">
                <button onclick="location.href='executor-login.html'" class="btn-secondary-outline">Already Verified?</button>
                <button onclick="location.href='index.html'" class="btn-secondary-outline">Back Home</button>
            </div>

        </div>
    </main>

    <footer class="page-footer">
        &copy; 2026 DIGIPASS
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.5.0/qrcode.min.js"></script>
    <script>
        const API_URL = 'https://digipass-3l63.onrender.com';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (token) {
            // If token is in URL, set it and prepare form
            localStorage.setItem('executorToken', token);
            location.href = 'executor-register.html?token=' + token;
        }

        // Generate QR code with verification link
        const verificationLink = `${window.location.origin}/executor-verify.html`;
        const linkWithToken = token ? `${API_URL}/executor-verify?token=${token}` : verificationLink;

        // Display verification link
        document.getElementById('verificationLink').textContent = linkWithToken;

        // Generate QR code
        const qrContainer = document.getElementById('qrCodeDisplay');
        qrContainer.innerHTML = '';
        new QRCode({
            text: linkWithToken,
            width: 256,
            height: 256,
            colorDark: '#102c26',
            colorLight: '#f7e7ce',
            correctLevel: QRCode.CorrectLevel.H
        });

        function copyLink() {
            const link = document.getElementById('verificationLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert('Link copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy link');
            });
        }

        function openLink() {
            const link = document.getElementById('verificationLink').textContent;
            window.open(link, '_blank');
        }
    </script>
</body>
</html>
